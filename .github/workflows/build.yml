name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Ajusta si tu app está en una subcarpeta (ej. KHANIA). Si está en repo root, pon ".".
      APP_DIR: KHANIA

    steps:
    - name: Checkout del repo
      uses: actions/checkout@v4

    - name: Instalar dependencias esenciales del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tar git zip unzip wget coreutils \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libltdl-dev ant openjdk-17-jdk-headless

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Crear entorno virtual e instalar Buildozer
      run: |
        set -e
        python -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip==23.1.2
        pip install \
          "setuptools<70" \
          "wheel<0.41" \
          "Cython==0.29.33" \
          "buildozer==1.5.0" \
          "git+https://github.com/kivy/python-for-android.git@master" || true
        python --version
        pip --version
        .venv/bin/buildozer --version || true

    - name: Inyectar llave de Gemini (si corresponde)
      if: ${{ secrets.GEMINI_API_KEY != '' }}
      run: |
        # Crea carpeta dentro del directorio de la app para la llave
        mkdir -p "${{ env.APP_DIR }}/KHANIA_SECRETS"
        # Escribe la llave desde el secreto en un archivo con permisos restringidos
        printf "%s" "${{ secrets.GEMINI_API_KEY }}" > "${{ env.APP_DIR }}/KHANIA_SECRETS/llave"
        chmod 600 "${{ env.APP_DIR }}/KHANIA_SECRETS/llave"

    - name: Preparar Android SDK en .buildozer
      run: |
        set -e
        ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        mkdir -p "$ANDROID_HOME"
        mkdir -p "$ANDROID_HOME/licenses"
        mkdir -p "$HOME/.android"
        echo '### License policies' > $HOME/.android/repositories.cfg

        # Escribir licencias (valores comunes)
        cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
        24333f8a43b68257485db91320387e740938173d
        84831b4009046f4a4fbef8215316f4fcb640a850
        d56f5187479451eabf01fb78af6dfcb131a648fa
        2d41b4395567bc7d35399587a8e265215560b734
        33fb1f69ff094a97405e3264426569ec983276cd
        e66c8cd398e29a997ef2a709088661fc5f03d6d6
        EOF

        # Descargar y descomprimir herramientas de línea de comandos
        CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        wget -q "$CMDLINE_TOOLS_URL" -O cmdtools.zip
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
        cp -r temp_tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
        rm -rf cmdtools.zip temp_tools

        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

        # Aceptar licencias e instalar componentes básicos (incluye NDK recomendado)
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
        sdkmanager --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-31" \
          "build-tools;31.0.0" \
          "ndk;21.4.7075529" || true

    - name: Verificar Android SDK instalado
      run: |
        set -e
        ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        test -d "$ANDROID_HOME/platforms/android-31" || (echo "platforms;android-31 no encontrado" && exit 1)
        test -d "$ANDROID_HOME/build-tools/31.0.0" || (echo "build-tools;31.0.0 no encontrado" && exit 1)
        test -d "$ANDROID_HOME/ndk/21.4.7075529" || echo "NDK 21 no encontrado (buildozer puede descargar otro NDK si es necesario)"

    - name: Preparar y limpiar antes de compilar
      run: |
        set -euo pipefail
        # Asegurarse de que exista el directorio de la app
        if [ ! -d "${{ env.APP_DIR }}" ]; then
          echo "Directorio de la app '${{ env.APP_DIR }}' no encontrado. Asegúrate de que tu app (y buildozer.spec) esté en esa carpeta."
          ls -la
          exit 1
        fi
        # Limpiar artefactos previos
        rm -rf "${{ env.APP_DIR }}/.buildozer" "${{ env.APP_DIR }}/bin"

    - name: Ejecutar Buildozer (compilar APK)
      working-directory: ${{ env.APP_DIR }}
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUNBUFFERED: "1"
        ANDROID_SDK_ROOT: ${{ runner.home }}/.buildozer/android/platform/android-sdk
        JAVA_HOME: ${{ env.JAVA_HOME }}
        PATH: ${{ github.workspace }}/.venv/bin:$PATH
      run: |
        set -euo pipefail
        echo "Usando PATH: $PATH"
        # Ejecutar buildozer desde el virtualenv
        . "${{ github.workspace }}/.venv/bin/activate"
        # Puedes ajustar la línea según necesites: android debug / android release / android debug deploy
        .venv/bin/buildozer -v android debug || (echo "Buildozer falló. Consulta los logs anteriores." && exit 1)

    - name: Medir APK y generar resumen
      working-directory: ${{ env.APP_DIR }}
      run: |
        set -euo pipefail
        # Buscar APKs (variantes comunes)
        APK_PATH=$(ls -1 bin/*.apk 2>/dev/null | head -n1 || true)
        # Algunas versiones crean apk en bin/ o bin/*.apk o bin/*-debug.apk
        if [ -z "$APK_PATH" ]; then
          APK_PATH=$(find bin -type f -name "*.apk" | head -n1 || true)
        fi
        if [ -z "$APK_PATH" ]; then
          echo "No se encontró APK en ${PWD}/bin. Listado de archivos para diagnóstico:"
          ls -la .
          ls -la bin || true
          exit 1
        fi

        echo "Found APK: $APK_PATH"
        du -h "$APK_PATH" > apk-size.txt
        ls -lh "$APK_PATH" >> apk-size.txt
        echo "$APK_PATH" > apk-path.txt

        # Escribir resumen al step summary de GitHub Actions
        {
          echo "## APK generado"
          echo ""
          echo "- Ruta: \`$APK_PATH\`"
          echo "- Tamaño y permisos:"
          cat apk-size.txt
        } >> $GITHUB_STEP_SUMMARY

        # Mostrar en logs
        cat apk-size.txt

    - name: Subir APK y datos como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: |
          ${{ env.APP_DIR }}/bin/*.apk
          ${{ env.APP_DIR }}/apk-size.txt
          ${{ env.APP_DIR }}/apk-path.txt
