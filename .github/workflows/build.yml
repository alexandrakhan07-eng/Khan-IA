name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Instalar dependencias esenciales del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          tar git zip unzip wget coreutils \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libltdl-dev ant

    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Crear entorno virtual e instalar Buildozer
      run: |
        set -e
        python -m venv .venv
        # activar el venv en este step para tener buildozer en PATH
        . .venv/bin/activate
        pip install --upgrade pip==23.1.2
        pip install \
          "setuptools<70" \
          "wheel<0.41" \
          "Cython==0.29.33" \
          "buildozer==1.5.0"
        # mostrar versiones para diagnóstico
        python --version
        pip --version
        .venv/bin/buildozer --version || true

    - name: Inyectar llave de Gemini de forma segura
      run: |
        mkdir -p KHANIA
        # Usar variable de entorno de GitHub Actions en el run (no expuesta en logs)
        echo "${{ secrets.GEMINI_API_KEY }}" > "KHANIA/llave"
        chmod 600 KHANIA/llave

    - name: Inyectar licencias y herramientas del SDK
      run: |
        set -e
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/licenses
        mkdir -p $HOME/.android
        echo '### License policies' > $HOME/.android/repositories.cfg

        # Escribir licencias oficiales de Android (cada línea)
        cat > $ANDROID_HOME/licenses/android-sdk-license <<'EOF'
24333f8a43b68257485db91320387e740938173d
84831b4009046f4a4fbef8215316f4fcb640a850
d56f5187479451eabf01fb78af6dfcb131a648fa
2d41b4395567bc7d35399587a8e265215560b734
33fb1f69ff094a97405e3264426569ec983276cd
e66c8cd398e29a997ef2a709088661fc5f03d6d6
EOF

        # Descargar herramientas de línea de comandos de Android y descomprimir en layout moderno
        CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        wget -q $CMDLINE_TOOLS_URL -O cmdtools.zip
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        cp -r temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip temp_tools

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        # Aceptar licencias e instalar componentes
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
        sdkmanager --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-31" \
          "build-tools;31.0.0"

    - name: Verificar Android SDK
      run: |
        set -e
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --list | grep -E 'platforms;android-31|build-tools;31.0.0'

    - name: Limpiar y compilar APK (Buildozer)
      working-directory: KHANIA
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUNBUFFERED: "1"
      run: |
        set -euo pipefail
        # Prepend virtualenv bin to PATH en el mismo run
        export PATH="${{ github.workspace }}/.venv/bin:$PATH"

        echo "PATH=$PATH"
        which rm || echo "rm no encontrado"
        rm -rf .buildozer bin

        # Ejecutar buildozer (se usará el buildozer del venv)
        .venv/bin/buildozer -v android debug

    - name: Medir APK y generar resumen
      working-directory: KHANIA
      run: |
        set -euo pipefail
        # Buscar el APK generado
        APK_PATH=$(ls -1 bin/*.apk 2>/dev/null | head -n1 || true)
        if [ -z "$APK_PATH" ]; then
          echo "No se encontró APK en KHANIA/bin. Listado de archivos:"
          ls -la .
          ls -la bin || true
          exit 1
        fi

        echo "Found APK: $APK_PATH"
        du -h "$APK_PATH" > apk-size.txt
        ls -lh "$APK_PATH" >> apk-size.txt
        echo "$APK_PATH" > apk-path.txt

        {
          echo "## APK generado"
          echo ""
          echo "- Ruta: \`$APK_PATH\`"
          echo "- Tamaño:"
          cat apk-size.txt
        } >> $GITHUB_STEP_SUMMARY

        cat apk-size.txt

    - name: Subir APK y datos como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: |
          KHANIA/bin/*.apk
          KHANIA/apk-size.txt
          KHANIA/apk-path.txt
