name: Compilar APK Khan IA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar dependencias del sistema en Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            python3-dev \
            python3-pip \
            python3-setuptools \
            zip \
            unzip \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config

      - name: 4. Instalar Buildozer y Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: 5. Compilar APK con Buildozer
        run: |
          yes | buildozer -v android debug

      - name: 6. Guardar y Descargar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: KhanIA-APK-Debug
          path: bin/*.apk
