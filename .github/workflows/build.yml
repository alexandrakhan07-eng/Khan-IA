name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip wget \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          libffi-dev libssl-dev build-essential \
          libltdl-dev ant

    - name: Crear entorno virtual e instalar Buildozer
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip==23.1.2
        .venv/bin/pip install \
          "setuptools<70" \
          "wheel<0.41" \
          "Cython==0.29.33" \
          "buildozer==1.5.0"

    - name: Inyectar llave de Gemini de forma segura
      run: |
        echo '${{ secrets.GEMINI_API_KEY }}' > "KHANIA/llave"

    - name: Inyectar licencias y herramientas del SDK
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/licenses
        mkdir -p $HOME/.android
        echo '### License policies' > $HOME/.android/repositories.cfg

        # Escribir licencias oficiales de Android
        echo "24333f8a43b68257485db91320387e740938173d" > $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b4009046f4a4fbef8215316f4fcb640a850" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648fa" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "2d41b4395567bc7d35399587a8e265215560b734" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "33fb1f69ff094a97405e3264426569ec983276cd" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "e66c8cd398e29a997ef2a709088661fc5f03d6d6" >> $ANDROID_HOME/licenses/android-sdk-license

        # Descargar herramientas de línea de comandos de Android
        CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        wget -q $CMDLINE_TOOLS_URL -O cmdtools.zip
        mkdir -p temp_tools
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p $ANDROID_HOME/tools/bin
        cp -r temp_tools/cmdline-tools/bin/* $ANDROID_HOME/tools/bin/
        cp -r temp_tools/cmdline-tools/lib $ANDROID_HOME/tools/
        rm -rf cmdtools.zip temp_tools

        # Instalar componentes requeridos sin ocultar errores
        export PATH=$PATH:$ANDROID_HOME/tools/bin
        yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
        sdkmanager --sdk_root="$ANDROID_HOME" \
          "platform-tools" \
          "platforms;android-31" \
          "build-tools;31.0.0"

    - name: Verificar Android SDK
      run: |
        test -x "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
        "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --list | grep -E 'platforms;android-31|build-tools;31.0.0'

    - name: Limpiar y compilar APK
      working-directory: KHANIA
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PYTHONUNBUFFERED: "1"
      run: |
        rm -rf .buildozer bin
        ../.venv/bin/python -m buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: "KHANIA/bin/*.apk"
