name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          python3-dev \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          build-essential \
          libltdl-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip3 install --upgrade pip
        pip3 install Cython==0.29.33
        pip3 install buildozer

    - name: Inyectar llave de Gemini de forma segura
      run: |
        echo '${{ secrets.GEMINI_API_KEY }}' > "KHAN IA/llave"

    - name: Instalar Android SDK y Herramientas previas
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        # Usamos ppa o instalador directo de SDK si es necesario, pero le decimos a buildozer que use una versión estable en su spec.
        # Vamos a aceptar licencias de forma global para que no falle el SDK manager:
        mkdir -p $HOME/.android
        echo '### License policies' > $HOME/.android/repositories.cfg

    - name: Compilar APK con Buildozer
      run: |
        cd "KHAN IA"
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: "KHAN IA/bin/*.apk"
