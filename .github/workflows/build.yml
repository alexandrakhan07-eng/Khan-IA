name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          python3-dev \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev \
          build-essential \
          libltdl-dev \
          ant

    - name: Instalar Buildozer y Cython
      run: |
        pip3 install --upgrade pip
        pip3 install Cython==0.29.33
        pip3 install buildozer

    - name: Inyectar llave de Gemini de forma segura
      run: |
        echo '${{ secrets.GEMINI_API_KEY }}' > "KHAN IA/llave"

    - name: Instalar SDK y forzar licencias para Build-Tools (31 y 37)
      run: |
        ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME
        mkdir -p $HOME/.android
        echo '### License policies' > $HOME/.android/repositories.cfg

        # Descargar command-line tools de Android
        CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
        wget -q $CMDLINE_TOOLS_URL -O cmdtools.zip
        mkdir -p temp_tools
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip temp_tools

        # Aceptar licencias e instalar tanto la 31.0.0 (de tu spec) como la 37.0.0 por compatibilidad
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-31" "build-tools;31.0.0" "build-tools;37.0.0" || true

    - name: Compilar APK con Buildozer
      run: |
        cd "KHAN IA"
        buildozer -v android debug

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-debug
        path: "KHAN IA/bin/*.apk"
